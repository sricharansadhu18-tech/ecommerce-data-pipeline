name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Python unit tests
        run: python -m pytest tests/ -q

      - name: Compile Python entrypoints
        run: |
          python -m py_compile src/ingest.py
          python -m py_compile airflow/dags/ecommerce_pipeline.py

      - name: Required files present
        run: |
          test -f docker-compose.yml
          test -f dbt/dbt_project.yml
          test -f dbt/packages.yml
          test -f .env.example
          test -f LICENSE
          test -f data/raw/.gitkeep
          test -f airflow/dags/ecommerce_pipeline.py

  dbt-parse:
    name: dbt parse (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ecommerce
      PGPASSWORD: ecommerce
      PGDATABASE: ecommerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-core>=1.10.0,<1.11" "dbt-postgres==1.10.2"

      - name: dbt deps + parse + compile
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir . --target dev
          dbt compile --profiles-dir . --target dev

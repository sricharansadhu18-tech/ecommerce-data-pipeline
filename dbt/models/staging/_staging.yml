version: 2

models:
  - name: stg_orders
    description: Cleaned order header grain. One row per order_id.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'invoiced', 'shipped', 'processing', 'unavailable', 'canceled', 'created', 'approved']
      - name: order_date
        tests: [not_null]
  - name: stg_order_items
    description: Cleaned order line grain. One row per order_id + order_item_id.
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: price
        tests: [not_null]
  - name: stg_customers
    description: Order-level customer records, including the stable customer_unique_id used for repeat analysis.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_unique_id
        tests: [not_null]
  - name: stg_products
    description: Products with typo columns renamed and English category names. Null or untranslated categories are filled.
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: product_category_name_english
        tests: [not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [not_null, unique]
  - name: stg_order_payments
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
  - name: stg_order_reviews
    description: Reviews at (review_id, order_id) grain. Blank titles and messages are stored as null.
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_geolocation
    description: One row per zip code prefix after dropping exact duplicate coordinates and standardising city names.
    columns:
      - name: geolocation_zip_code_prefix
        tests: [not_null, unique]
      - name: geolocation_lat
        tests: [not_null]
      - name: geolocation_lng
        tests: [not_null]
      - name: geolocation_city
        tests: [not_null]
      - name: geolocation_state
        tests: [not_null]
